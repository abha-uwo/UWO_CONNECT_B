name: Build and deploy Python app to Azure Web App - aisaconnectback

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_97120F1E9B5E453B95F2285E8EF64BA5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BE829F9ED7AE4A11AF5224E4864585B9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_558BAD392DD34F7DB9514ADD84B40E13 }}

      - name: Release Kudu deployment locks
        uses: azure/cli@v2
        with:
          inlineScript: |
            rg=$(az webapp list --query "[?name=='aisaconnectback'].resourceGroup" -o tsv)
            if [ -n "$rg" ]; then
              echo "Restarting webapp to clear deployment locks in resource group: $rg"
              az webapp restart --name aisaconnectback --resource-group "$rg"
            fi

      - name: Zip application package
        run: zip -r app.zip . -x "*.git*"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'aisaconnectback'
          slot-name: 'Production'
          package: 'app.zip'
          startup-command: 'daphne -b 0.0.0.0 -p 8080 core.asgi:application'